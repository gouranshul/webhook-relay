{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- range $key := list "RELAY_SECRET_KEY" "RELAY_API_TOKEN" "DB_PASSWORD" }}
{{- if not (index $.Values.secrets.values $key) }}
{{- fail (printf "secrets.values.%s is required when secrets.create=true" $key) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "webhook-relay.secretName" . }}
  labels:
    {{- include "webhook-relay.labels" . | nindent 4 }}
type: Opaque
stringData:
  RELAY_SECRET_KEY: {{ .Values.secrets.values.RELAY_SECRET_KEY | quote }}
  RELAY_API_TOKEN: {{ .Values.secrets.values.RELAY_API_TOKEN | quote }}
  DB_PASSWORD: {{ .Values.secrets.values.DB_PASSWORD | quote }}
{{- end }}
