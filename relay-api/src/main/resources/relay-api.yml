server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: relay-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/relay}
    username: ${DB_USER:relay}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 5000
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      compression-type: lz4
      properties:
        enable.idempotence: true
        linger.ms: 5
        max.block.ms: 10000
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
  lifecycle:
    timeout-per-shutdown-phase: 20s

relay:
  crypto:
    key: ${RELAY_SECRET_KEY:}
    key-id: ${RELAY_SECRET_KEY_ID:k1}
  api:
    token: ${RELAY_API_TOKEN:}
  endpoints:
    allow-private-networks: ${RELAY_ALLOW_PRIVATE_NETWORKS:false}
  outbox:
    workers: ${RELAY_OUTBOX_WORKERS:2}
    batch-size: ${RELAY_OUTBOX_BATCH_SIZE:200}
  kafka:
    partitions: ${RELAY_KAFKA_PARTITIONS:12}

management:
  otlp:
    metrics:
      export:
        # Metrics are scraped by Prometheus from /actuator/prometheus; no OTLP push.
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    export:
      otlp:
        # Off by default so a laptop without a collector does not log export errors. Compose turns it on.
        enabled: ${OTLP_TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
