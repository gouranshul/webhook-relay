# Local stack: infrastructure, observability and a flaky mock receiver.
# Usage: cp .env.example .env  (fill in the placeholders), then: docker compose up -d --build
name: webhook-relay

x-java-service: &java-service
  restart: unless-stopped
  build:
    context: .
    dockerfile: Dockerfile

services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  postgres:
    image: postgres:18.6-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relay}
      POSTGRES_USER: ${POSTGRES_USER:-relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      # PostgreSQL 18 images keep PGDATA under /var/lib/postgresql/18/docker, so mount the parent directory.
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.10.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mock-receiver:
    <<: *java-service
    build:
      context: .
      args:
        MODULE: mock-receiver
    image: webhook-relay/mock-receiver:local
    ports:
      - "8090:8090"
    environment:
      RECEIVER_FAILURE_RATE: ${RECEIVER_FAILURE_RATE:-0.10}
      RECEIVER_MIN_LATENCY_MS: ${RECEIVER_MIN_LATENCY_MS:-50}
      RECEIVER_MAX_LATENCY_MS: ${RECEIVER_MAX_LATENCY_MS:-200}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30

  relay-api:
    <<: *java-service
    build:
      context: .
      args:
        MODULE: relay-api
    image: webhook-relay/relay-api:local
    ports:
      - "8080:8080"
    environment: &relay-env
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-relay}
      DB_USER: ${POSTGRES_USER:-relay}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      RELAY_SECRET_KEY: ${RELAY_SECRET_KEY:?set RELAY_SECRET_KEY in .env}
      RELAY_API_TOKEN: ${RELAY_API_TOKEN:?set RELAY_API_TOKEN in .env}
      # The mock receiver lives on the compose network, which is private address space.
      RELAY_ALLOW_PRIVATE_NETWORKS: "true"
      OTLP_TRACING_ENABLED: "true"
      OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      VIRTUAL_THREADS_ENABLED: ${VIRTUAL_THREADS_ENABLED:-true}
      JAVA_TOOL_OPTIONS: ${API_JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 40

  relay-dispatcher:
    <<: *java-service
    build:
      context: .
      args:
        MODULE: relay-dispatcher
    image: webhook-relay/relay-dispatcher:local
    ports:
      - "8081:8081"
    environment:
      <<: *relay-env
      RELAY_DISPATCHER_EXECUTOR: ${RELAY_DISPATCHER_EXECUTOR:-virtual}
      RELAY_DISPATCHER_PLATFORM_POOL_SIZE: ${RELAY_DISPATCHER_PLATFORM_POOL_SIZE:-200}
      RELAY_DISPATCHER_CONCURRENCY: ${RELAY_DISPATCHER_CONCURRENCY:-16}
      RELAY_BULKHEAD_PER_ENDPOINT: ${RELAY_BULKHEAD_PER_ENDPOINT:-50}
      RELAY_RETRY_MAX_DELAY: ${RELAY_RETRY_MAX_DELAY:-10m}
      JAVA_TOOL_OPTIONS: ${DISPATCHER_JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
    depends_on:
      relay-api:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-receiver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 40

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686"

  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:13.2.3
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboard.json:/var/lib/grafana/dashboards/webhook-relay.json:ro
    depends_on:
      - prometheus

volumes:
  pg-data:
